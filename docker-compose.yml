services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: matcher
      POSTGRES_PASSWORD: matcher
      POSTGRES_DB: product_matcher
    ports:
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U matcher -d product_matcher"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
